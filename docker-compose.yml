# OrbStack / Docker Desktop: `docker compose up --build`
#
# Copy docker.env.example to `.env` and set JWT_SECRET (Compose reads `.env` automatically).
#
# Seed data (optional):
# - Inside the app container (after rebuild): docker compose exec app npm run seed
# - From the host against mapped Postgres: DATABASE_URL=postgresql://postgres:<POSTGRES_PASSWORD>@127.0.0.1:5432/music_share npm run seed

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: music_share
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_share"]
      interval: 3s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/music_share
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (e.g. in a .env file beside docker-compose.yml)}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy